<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EDE9E3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Muse. Styled from what you own.</title>
<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg:#EDE9E3;
    --surface:#FBFAF7;
    --surface-2:#F3EFE8;
    --ink:#262220;
    --ink-soft:#6B635C;
    --ink-faint:#9A9088;
    --hair:#DED8CE;
    --accent:#9B7A4C;
    --accent-soft:#C6A879;
    --accent-wash:#EFE6D6;
    --good:#5E7355;
    /* effort temperature ramp (cool stone -> warm clay) */
    --e1:#E9E7E2;
    --e2:#ECE7DE;
    --e3:#EFE6D9;
    --e4:#F1E1D2;
    --shadow:0 24px 60px -28px rgba(45,38,30,.45);
    --radius:18px;
    --serif:"Didot","Bodoni 72","Hoefler Text",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161311;--surface:#221E1A;--surface-2:#2A251F;
      --ink:#EFEAE1;--ink-soft:#A99F92;--ink-faint:#7C7368;
      --hair:#322C25;--accent:#C6A16A;--accent-soft:#8C7146;--accent-wash:#2E2519;
      --good:#8FA383;
      --e1:#242019;--e2:#28221A;--e3:#2C2519;--e4:#312717;
      --shadow:0 24px 60px -30px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="light"]{
    --bg:#EDE9E3;--surface:#FBFAF7;--surface-2:#F3EFE8;
    --ink:#262220;--ink-soft:#6B635C;--ink-faint:#9A9088;
    --hair:#DED8CE;--accent:#9B7A4C;--accent-soft:#C6A879;--accent-wash:#EFE6D6;--good:#5E7355;
    --e1:#E9E7E2;--e2:#ECE7DE;--e3:#EFE6D9;--e4:#F1E1D2;
    --shadow:0 24px 60px -28px rgba(45,38,30,.45);
  }
  :root[data-theme="dark"]{
    --bg:#161311;--surface:#221E1A;--surface-2:#2A251F;
    --ink:#EFEAE1;--ink-soft:#A99F92;--ink-faint:#7C7368;
    --hair:#322C25;--accent:#C6A16A;--accent-soft:#8C7146;--accent-wash:#2E2519;--good:#8FA383;
    --e1:#242019;--e2:#28221A;--e3:#2C2519;--e4:#312717;
    --shadow:0 24px 60px -30px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100dvh;
  }
  button{font-family:inherit;cursor:pointer;color:inherit}
  @media (prefers-reduced-motion: no-preference){
    .fade{animation:fade .5s ease both}
  }
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  ::selection{background:var(--accent-wash)}

  /* ---------- Phone frame ---------- */
  .phone{
    position:relative;
    width:100%;
    max-width:440px;
    margin:0 auto;
    height:100vh;
    height:100dvh; /* the app always scrolls itself; the outer page (e.g. the artifact viewer) may not scroll at all */
    overflow:hidden;
    background:var(--surface);
    display:flex;
    flex-direction:column;
  }
  #app{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto}
  @media (min-width:520px){
    body{padding:26px 0}
    .phone{height:calc(100vh - 52px);height:calc(100dvh - 52px);border-radius:34px;box-shadow:var(--shadow);border:1px solid var(--hair)}
  }
  .screen{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 22px 120px;
  }
  .screen::-webkit-scrollbar{width:0}
  .stickybar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;
    padding:18px 0 10px;margin-top:4px;
    background:linear-gradient(to top,var(--surface) 82%,transparent)}
  .stickybar .btn{box-shadow:0 12px 30px -12px rgba(45,38,30,.5)}

  /* ---------- Typography ---------- */
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .serif{font-family:var(--serif)}
  h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
  h1{font-size:33px;line-height:1.08}
  h2{font-size:25px;line-height:1.12}
  .lede{color:var(--ink-soft);font-size:15px;line-height:1.5}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--surface) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    padding:calc(env(safe-area-inset-top) + 16px) 22px 12px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid transparent;
  }
  .topbar.bordered{border-bottom-color:var(--hair)}
  .wordmark{font-family:var(--serif);font-size:22px;letter-spacing:.02em}
  .wordmark b{font-weight:400}
  .wordmark .dot{color:var(--accent)}
  .avatar{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);
    background:var(--accent-wash);color:var(--accent);
    display:grid;place-items:center;font-size:13px;font-weight:600;
    font-family:var(--serif);
  }
  .iconbtn{background:none;border:none;padding:8px;color:var(--ink-soft);border-radius:10px;display:grid;place-items:center}
  .iconbtn:active{background:var(--surface-2)}

  /* ---------- Chips ---------- */
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--hair);background:var(--surface);
    color:var(--ink-soft);padding:8px 15px;border-radius:100px;font-size:13px;
    letter-spacing:.01em;white-space:nowrap;transition:.18s;font-weight:500;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .chip.accent[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    background:var(--ink);color:var(--surface);border:none;
    padding:16px 22px;border-radius:100px;font-size:15px;font-weight:600;
    width:100%;letter-spacing:.01em;transition:.16s;
  }
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--hair)}
  .btn.accent{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.4}
  .btn svg{width:19px;height:19px;flex:0 0 auto}
  .backlink svg{width:17px;height:17px;flex:0 0 auto}
  .upload svg{width:28px;height:28px;color:var(--ink-faint)}

  /* ---------- Garment tiles ---------- */
  .tile{
    position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--hair);
    aspect-ratio:1/1.16;display:grid;place-items:center;
    background:var(--tile,var(--surface-2));
  }
  .tile svg.garment{width:58%;height:58%;color:color-mix(in srgb,var(--ink) 62%,var(--tile-ink,var(--ink-soft)))}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile .swatch{position:absolute;left:8px;bottom:8px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .card-label{margin-top:8px}
  .card-label .nm{font-size:12.5px;line-height:1.25;color:var(--ink);font-weight:500}
  .card-label .ct{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px 12px}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  .piece{border:none;background:none;padding:0;text-align:left;width:100%}
  .piece:active .tile{border-color:var(--accent)}

  /* ---------- Outfit cards ---------- */
  .outfit{
    border-radius:var(--radius);border:1px solid var(--hair);
    padding:16px 16px 18px;margin-bottom:14px;background:var(--otint,var(--surface-2));
  }
  .outfit-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .effort-name{font-family:var(--serif);font-size:19px}
  .effort-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px}
  .meter{display:flex;gap:5px;align-items:center}
  .meter i{width:7px;height:7px;border-radius:50%;background:var(--hair);display:block}
  .meter i.on{background:var(--accent)}
  .pieces{display:flex;gap:9px;margin-bottom:12px}
  .pieces .mini{
    flex:1;border-radius:11px;border:1px solid color-mix(in srgb,var(--hair) 70%,transparent);
    aspect-ratio:1/1.14;display:grid;place-items:center;background:var(--tile,var(--surface));position:relative;overflow:hidden;
  }
  .pieces .mini svg{width:56%;height:56%;color:color-mix(in srgb,var(--ink) 60%,var(--tile-ink,var(--ink-soft)))}
  .pieces .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .rationale{font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
  .rationale b{color:var(--ink);font-weight:600}

  /* ---------- Bottom nav ---------- */
  .nav{
    position:absolute;left:0;right:0;bottom:0;z-index:30;
    display:flex;align-items:center;justify-content:space-around;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 12px);
    background:color-mix(in srgb,var(--surface) 90%,transparent);
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-top:1px solid var(--hair);
  }
  .navbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);padding:4px 14px;font-size:10.5px;letter-spacing:.06em}
  .navbtn svg{width:22px;height:22px}
  .navbtn[aria-current="true"]{color:var(--ink)}
  .navbtn.add{color:var(--surface)}
  .navbtn.add .plus{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 10px 22px -8px var(--accent);margin-top:-14px}
  .navbtn.add .plus svg{color:#fff}

  /* ---------- Misc ---------- */
  .section-gap{height:26px}
  .hair{height:1px;background:var(--hair);margin:20px 0;border:none}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--hair);padding:5px 11px;border-radius:100px}
  .note{background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
  .note svg,.pill svg{width:16px;height:16px;flex:0 0 auto;color:var(--accent)}
  .empty{text-align:center;color:var(--ink-faint);padding:44px 20px;font-size:14px}
  .pwrap{position:relative}
  .rm{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;
    background:var(--ink);color:var(--surface);border:none;font-size:12px;line-height:1;
    display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(0,0,0,.45)}
  .impcard .field{padding:9px 11px;font-size:13px;margin-top:8px}
  .tipline{display:flex;gap:7px;align-items:flex-start;margin-top:10px;padding-top:10px;
    border-top:1px solid color-mix(in srgb,var(--hair) 65%,transparent);
    font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
  .tipline svg{width:14px;height:14px;flex:0 0 auto;color:var(--accent);margin-top:2px}
  .daycta{width:100%;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;
    text-align:left;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--radius);
    padding:17px 18px;background:linear-gradient(120% 120% at 100% 0%,var(--accent-wash),var(--surface));transition:.16s}
  .daycta:active{transform:scale(.99)}
  .daycta-h{font-family:var(--serif);font-size:22px;margin:3px 0 2px}
  .daycta-s{font-size:12.5px;color:var(--ink-soft)}
  .daycta-arrow{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;transform:rotate(180deg)}
  .daycta-arrow svg{width:18px;height:18px}
  .backlink{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);background:none;border:none;padding:6px 0;margin-bottom:4px}

  /* onboarding */
  .cover{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 30px calc(env(safe-area-inset-bottom) + 34px);gap:22px;background:
    radial-gradient(120% 80% at 50% -10%, var(--accent-wash) 0%, transparent 55%), var(--surface)}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps i{flex:1;height:3px;border-radius:3px;background:var(--hair)}
  .steps i.on{background:var(--accent)}
  .selectgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:1px solid var(--hair);background:var(--surface);border-radius:14px;padding:15px 14px;text-align:left;transition:.16s}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash)}
  .opt .t{font-size:15px;font-weight:600;color:var(--ink)}
  .opt .d{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
  .swrow{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--hair);position:relative}
  .sw[aria-pressed="true"]{border-color:var(--accent)}
  .sw[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--surface) inset}
  .upload{border:1.5px dashed var(--hair);border-radius:16px;padding:22px;text-align:center;color:var(--ink-soft);font-size:13px;display:block;transition:.16s}
  .upload:active{border-color:var(--accent);background:var(--surface-2)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .thumbs img{width:52px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--hair)}
  .field{width:100%;border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:13px 15px;font-size:15px;color:var(--ink);font-family:inherit;margin-top:8px}
  .field:focus{outline:2px solid var(--accent-soft);outline-offset:1px}
  label.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;display:block;margin-top:16px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="phone">
  <div id="app"></div>
</div>

<script>
/* ============================================================
   Muse, personal styling prototype
   All client-side. Wardrobe + profile persist in localStorage.
   The styling engine here is rule-based so the whole flow works
   with zero setup; it's structured so a Claude vision+reasoning
   brain can slot straight in later (tagging photos, richer outfits).
   ============================================================ */

/* ---------- Icon set (UI + garments) ---------- */
const UI = {
  morning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="13" r="4"/><path d="M12 3v2M12 21v0M4 13H2M22 13h-2M5.6 6.6 4.2 5.2M18.4 6.6l1.4-1.4"/><path d="M6 20h12"/></svg>',
  wardrobe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M12 3v18M9 11h.01M15 11h.01"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
};
const G = {
  tshirt:'<path d="M5 8L10 6Q15 10 20 6L25 8L28 13L24 15L23 13.5V35H7V13.5L6 15L2 13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  cami:'<path d="M11 6c0 2 2 3 4 3s4-1 4-3M11 6l-3 4 3 1v20h10V11l3-1-3-4M11 6l4 3 4-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  blouse:'<path d="M9 8l6-3 6 3 3 4-3 3v18H9V15l-3-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 5v27" stroke="currentColor" stroke-width="1" opacity=".5"/>',
  knit:'<path d="M8 10l4-4 3 2 3-2 4 4 2 4-3 2v18H9V16l-3-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 12l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>',
  trousers:'<path d="M10 5h10l1 12-1 18h-5l-1-15-1 15H8L9 17z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  skirt:'<path d="M9 6h12l4 13c-4 3-16 3-20 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  shorts:'<path d="M9 6h12l1 9-1 9h-5l-1-9-1 9H8l-1-9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  dress:'<path d="M10 5c0 2 2 3 5 3s5-1 5-3M10 5l-2 6 2 2-3 20h12l-3-20 2-2-2-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  coat:'<path d="M9 7l6-3 6 3 2 5-2 2v20h-6V16h-0V34H9V14l-2-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 8v26" stroke="currentColor" stroke-width="1" opacity=".5"/>',
  blazer:'<path d="M9 7l6-3 6 3 2 6-2 1v20h-5l-1-14-1 14H9V14l-2-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 8l-3 8M15 8l3 8" stroke="currentColor" stroke-width="1" opacity=".5"/>',
  trainer:'<path d="M4 24c1-3 3-4 5-5l4-4 2 3 4 1c3 .5 6 1 8 3 1 1 1 3 0 4H5c-1 0-1.5-1-1-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 15l2 4M16 16l2 3" stroke="currentColor" stroke-width="1" opacity=".6"/>',
  flat:'<path d="M5 22c3-1 6-2 9-2s7 .5 10 2c1 .5 1 3-1 3H6c-2 0-2-2.5-1-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 20c1-1 3-1 4 0" stroke="currentColor" stroke-width="1" opacity=".6"/>',
  heel:'<path d="M6 12c2 4 4 6 8 7 4 1 9 2 12 4 1 1 0 3-2 3-6-1-11-2-15-5-3-2-4-6-4-9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 26l1 6" stroke="currentColor" stroke-width="1.5"/>',
  boot:'<path d="M11 5h5v14c2 2 5 3 7 4 2 1 2 4-1 4h-11c-1 0-2-1-2-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  necklace:'<path d="M8 8c0 6 3.5 10 7 10s7-4 7-10" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="21" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  earrings:'<circle cx="11" cy="13" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 8.5V6" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="13" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M20 8.5V6" stroke="currentColor" stroke-width="1.5"/>',

/* Read an image file -> small JPEG data-URI + dominant garment colour */
function fileToTile(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const m=600,sc=Math.min(1,m/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
        // sample the central region; skip near-white pixels (flat-lay background)
        const rw=Math.max(1,Math.round(c.width*.44)),rh=Math.max(1,Math.round(c.height*.44));
        const d=x.getImageData(Math.round(c.width*.28),Math.round(c.height*.28),rw,rh).data;
        let r=0,g=0,b=0,n=0,ar=0,ag=0,ab=0,an=0;
        for(let i=0;i<d.length;i+=16){
          const R=d[i],G=d[i+1],B=d[i+2];
          ar+=R;ag+=G;ab+=B;an++;
          if(R>235&&G>235&&B>235)continue; // background
          r+=R;g+=G;b+=B;n++;
        }
        if(!n){r=ar;g=ag;b=ab;n=an;}
        const hex='#'+[r,g,b].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('');
        URL.revokeObjectURL(url);
        resolve({photo:c.toDataURL('image/jpeg',0.78),hex});
      }catch(e){URL.revokeObjectURL(url);resolve({error:file.name});}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve({error:file.name});};
    img.src=url;
  });
}
function nearestColourName(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  const s=d?d/(1-Math.abs(2*l-1)):0;
  let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=(h*60+360)%360;}
  if(l<0.13)return'Black';
  if(l>0.92&&s<0.18)return'White';
  if(l>0.8&&s<0.3&&h>=20&&h<=90)return'Cream';
  if(s<0.11)return l<0.3?'Charcoal':l>0.75?'Off-white':'Grey';
  if(h<15||h>=345)return l>0.65?'Pink':'Red';
  if(h<45)return l<0.35?'Brown':(s<0.55?'Camel':'Orange');
  if(h<70)return'Yellow';
  if(h<160)return s<0.35?'Sage':'Green';
  if(h<200)return'Teal';
  if(h<250)return l<0.35?'Navy':'Blue';
  if(h<290)return'Purple';
  return'Pink';
}

// colour compatibility: neutrals go with everything; otherwise reward tonal/analogous, gentle penalty for two loud colours
function colourScore(a,b){
  if(a.neutral||b.neutral) return 1;
  const h1=hueOf(a.hex),h2=hueOf(b.hex);
  const d=Math.abs(h1-h2); const dist=Math.min(d,360-d);
  if(dist<40) return 0.9;         // analogous / tonal
  if(dist>150) return 0.55;       // near-complementary, can work
  return 0.35;                    // clashy
}
function hueOf(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; if(!d)return 0;
  let h; if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4;
  return (h*60+360)%360;
}
function valueOf(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.2126*r+0.7152*g+0.0722*b)/255;}
function satOf(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b);return mx?(mx-Math.min(r,g,b))/mx:0;}
function metalOf(it){const h=hueOf(it.hex),s=satOf(it.hex);if(s<0.16)return'silver';if(h>=18&&h<=62)return'gold';return'mixed';}
function isHated(it){const p=store.profile||{};return (p.hated||[]).some(h=>nearestColourName(h)===nearestColourName(it.hex));}
// profile-aware bonus: loved colours, undertone->metal for jewellery, personal contrast level
function personalScore(c,anchor){
  const p=store.profile||{};let s=0.5;
  const fam=nearestColourName(c.hex);
  if((p.loved||[]).some(h=>nearestColourName(h)===fam))s+=0.25;
  if(c.cat==='jewellery'&&p.undertone&&!/neutral/i.test(p.undertone)){
    const m=metalOf(c),warm=/warm/i.test(p.undertone);
    if(m==='gold') s+= warm?0.35:-0.2;
    else if(m==='silver') s+= warm?-0.2:0.35;
  }
  if(p.contrast&&anchor&&c.cat!=='jewellery'){
    const dv=Math.abs(valueOf(c.hex)-valueOf(anchor.hex));
    if(/low/i.test(p.contrast)) s+= dv<0.25?0.2:(dv>0.5?-0.2:0);       // tonal dressing
    if(/high/i.test(p.contrast)) s+= dv>0.4?0.2:(dv<0.15?-0.1:0);      // deliberate value gaps

}
function pick(cands,target,used,anchor){
  if(!cands.length) return null;
  const nice=cands.filter(c=>!isHated(c));            // "never dress me in" is a hard rule
  if(nice.length)cands=nice;
  let best=null,bestScore=-1;
  for(const c of cands){
    const fitForm=1-Math.min(1,Math.abs(c.formality-target)/2.6);
    const col=colourScore(c,anchor);
    const fresh=used.has(c.id)?0.55:1;               // encourage variety across the four looks
    const s=fitForm*0.5+col*0.25+fresh*0.08+personalScore(c,anchor)*0.17;
    if(s>bestScore){bestScore=s;best=c;}
  }
  return best;
}
function buildLook(anchor,level,occasion,used){
  const occ=OCCASIONS.find(o=>o.key===occasion);
  const target=Math.max(1,Math.min(5, level + 1 + occ.shift)); // level 1..4 -> base 2..5 formality
  const parts=[]; const localUsed=new Set(used);
  const take=(cat)=>{const c=pick(byCat(cat).filter(x=>x.id!==anchor.id&&!localUsed.has(x.id)),target,localUsed,anchor)
      ||pick(byCat(cat).filter(x=>x.id!==anchor.id),target,new Set(),anchor);
    if(c){parts.push(c);localUsed.add(c.id);used.add(c.id);}return c;};

  parts.push(anchor);
  if(anchor.cat==='top'){ take('bottom'); }
  else if(anchor.cat==='bottom'){ take('top'); }
  // dress: nothing extra core
  const shoes=take('shoes');
  // a layer for cooler / dressier looks
  if(target>=3.4 || anchor.warm===1){ take('outerwear'); }
  // jewellery: more as effort climbs
  if(level>=2){ take('jewellery'); }
  if(level>=4){ // second piece of jewellery for glam if available
    const extra=pick(byCat('jewellery').filter(x=>!localUsed.has(x.id)),target,new Set(),anchor);
    if(extra){parts.push(extra);localUsed.add(extra.id);}
  }
  return {level,target,parts,rationale:rationale(anchor,parts,level,occ)};
}
function rationale(anchor,parts,level,occ){
  const find=c=>parts.find(p=>p.cat===c);
  const bottom=find('bottom'),top=parts.find(p=>p.cat==='top'&&p.id!==anchor.id),
        shoes=find('shoes'),layer=find('outerwear'),jewel=parts.filter(p=>p.cat==='jewellery');

  const anchorN=anchor.name.toLowerCase();
  const lead={
    1:`Your <b>${anchorN}</b>${other?` with the ${other.name.toLowerCase()}`:''}. Barely trying, still considered.`,
    2:`The <b>${anchorN}</b>${other?` and ${other.name.toLowerCase()}`:''} kept easy${shoes?`, grounded by ${shoes.name.toLowerCase()}`:''}.`,
    3:`A polished read on your <b>${anchorN}</b>${other?`, balanced with ${other.name.toLowerCase()}`:''}.`,
    4:`Your <b>${anchorN}</b> dialled all the way up${other?` over ${other.name.toLowerCase()}`:''}.`,
  }[level];
  const bits=[];const prof=store.profile||{};
  if(layer) bits.push(`the ${layer.name.toLowerCase()} adds a layer`);

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function stylistPicks(item){
  // for the "does it go with anything?" test
  const targets = item.cat==='top'||item.cat==='dress' ? ['bottom','shoes','outerwear'] :
                  item.cat==='bottom' ? ['top','shoes'] :
                  item.cat==='shoes' ? ['top','bottom','dress'] :
                  ['top','bottom','dress']; // jewellery/outerwear
  const pool=store.wardrobe.filter(x=> targets.includes(x.cat));
  return pool.map(c=>({c,score:colourScore(c,item)*0.6 + (1-Math.abs(c.formality-item.formality)/4)*0.4}))
    .sort((a,b)=>b.score-a.score).filter(x=>x.score>0.5).slice(0,4).map(x=>x.c);
}

  if(top&&bottom&&nearestColourName(top.hex)===nearestColourName(bottom.hex))tips.push('A one-colour column reads tall and expensive. Match the shoes to the bottoms and it runs to the floor.');

  if(layer)tips.push('Wear the layer open. The unbroken vertical line lengthens your whole frame.');

  if(shoes&&level>=3)tips.push('A pointed or low-cut shoe extends the leg line, especially with a midi length.');
  if(!layer&&(top&&bottom)&&level>=2)tips.push('If it feels unfinished, add a third piece: a layer, a belt, or one bold accessory.');

const CATORDER={dress:1,top:1,bottom:2,outerwear:3,shoes:4,jewellery:5};
function itemWarmth(it){ // 'warm' heavy, 'cool' summer, 'mid'
  if(['coat','knit','boot'].includes(it.sub)||it.cat==='outerwear') return 'warm';
  if(it.sub==='shorts'||it.sub==='cami'||(it.tags||[]).includes('warm-weather')||(it.tags||[]).includes('summer')) return 'cool';
  return 'mid';
}
const isSandal=it=> (it.tags||[]).includes('warm-weather') || /sandal/i.test(it.name);
function filteredCat(cat,ctx){
  let list=byCat(cat);
  if(ctx){
    if(ctx.temp<=1) list=list.filter(it=>itemWarmth(it)!=='cool');   // cold: no summer pieces
    if(ctx.temp>=3) list=list.filter(it=>itemWarmth(it)!=='warm');   // hot: no heavy pieces
    if(cat==='shoes'){
      if(ctx.movement==='high'&&!ctx.dressy) list=list.filter(s=>s.formality<=3);
      if(ctx.rain) list=list.filter(s=>!isSandal(s));
    }
  }
  return list.length?list:byCat(cat); // never let a filter empty a slot
}
function composeOutfit(target,ctx,level,mustInclude){
  const used=new Set(),parts=[];
  const add=it=>{if(it&&!used.has(it.id)){parts.push(it);used.add(it.id);}return it;};
  const anchorC=()=>parts[0]||{neutral:true,hex:'#888888'};
  const take=cat=>{let c=pick(filteredCat(cat,ctx).filter(x=>!used.has(x.id)),target,used,anchorC());
    if(!c)c=pick(byCat(cat).filter(x=>!used.has(x.id)),target,used,anchorC());return add(c);};
  let baseIsDress=false;
  if(mustInclude){add(mustInclude);if(mustInclude.cat==='dress')baseIsDress=true;}
  const haveTop=()=>parts.some(p=>p.cat==='top'),haveBot=()=>parts.some(p=>p.cat==='bottom'),haveDr=()=>parts.some(p=>p.cat==='dress');
  if(!haveDr()&&!haveTop()&&!haveBot()){
    const dresses=filteredCat('dress',ctx);
    if(dresses.length&&(ctx.dressy||target>=3.6)&&Math.random()<0.5){take('dress');baseIsDress=true;}
  }
  if(!baseIsDress&&!haveDr()){ if(!haveTop())take('top'); if(!haveBot())take('bottom'); }
  if(!parts.some(p=>p.cat==='shoes'))take('shoes');
  const cold=ctx.temp<=1,mild=ctx.temp===2;
  if(!parts.some(p=>p.cat==='outerwear')&&(cold||(mild&&target>=3.4))){const w=byCat('outerwear');if(w.length)take('outerwear');}
  if(level>=2&&!parts.some(p=>p.cat==='jewellery'))take('jewellery');
  if(level>=4){const j=pick(byCat('jewellery').filter(x=>!used.has(x.id)),target,used,anchorC());add(j);}
  return parts.sort((a,b)=>(CATORDER[a.cat]||9)-(CATORDER[b.cat]||9));
}
function matchNote(text){
  if(!text)return null; const t=text.toLowerCase();
  return store.wardrobe.find(it=> t.includes(it.name.toLowerCase()) )
    || store.wardrobe.find(it=> it.name.toLowerCase().split(' ').some(w=>w.length>3&&t.includes(w)) )
    || store.wardrobe.find(it=> it.color && t.includes(it.color.toLowerCase()) ) || null;
}
function planDay(plan){
  const act=ACTIVITIES.find(a=>a.key===plan.activity)||ACTIVITIES[0];
  const feel=FEELINGS.find(f=>f.key===plan.feel)||FEELINGS[0];
  const nightBump=plan.duration==='night'?0.4:0;
  const dressy=act.formality>=4||feel.shift>=0.7||plan.duration==='night';
  const ctx={temp:plan.temp,rain:!!plan.rain,movement:act.movement,dressy};
  const target=clamp(act.formality+feel.shift+nightBump+(dressy?0.2:0),1,5);
  let level = plan.effort==='auto' ? clamp(Math.round(act.formality-0.6+feel.shift+nightBump),1,4)
            : ({low:1,med:2,high:4})[plan.effort];
  level=clamp(level,1,4);
  const seed=matchNote(plan.note);
  return {
    act,feel,ctx,target,level,seed,
    primary:composeOutfit(target,ctx,level,seed),
    down:composeOutfit(clamp(target-1,1,5),{...ctx,dressy:false},clamp(level-1,1,4),seed&&seed.cat==='dress'?seed:null),
    up:composeOutfit(clamp(target+0.9,1,5),{...ctx,dressy:true},clamp(level+1,1,4),seed),
  };
}
function planRationale(r,parts){
  const find=c=>parts.find(p=>p.cat===c);
  const dress=find('dress'),top=find('top'),bottom=find('bottom'),shoes=find('shoes'),layer=find('outerwear'),jewel=parts.filter(p=>p.cat==='jewellery');
  const base = dress?`the ${dress.name.toLowerCase()}` : [top&&top.name.toLowerCase(),bottom&&bottom.name.toLowerCase()].filter(Boolean).join(' with ');
  let s=`For ${TEMPS[r.ctx.temp].toLowerCase()} weather and ${r.act.blurb}, styled to feel ${r.feel.label.toLowerCase()}: <b>${base||'this look'}</b>`;
  if(shoes) s+=`, grounded by ${shoes.name.toLowerCase()}`;
  if(layer) s+=`, layered under the ${layer.name.toLowerCase()}`;
  if(jewel.length) s+=`, finished with ${jewel.map(j=>j.name.toLowerCase()).join(' and ')}`;
  s+='.';
  const notes=[];
  if(r.ctx.movement==='high') notes.push('easy, flat shoes so you can keep moving');
  if(r.ctx.rain) notes.push('closed shoes and a layer for the rain');
  if(parts.every(p=>p.neutral)) notes.push('a quiet, tonal palette');
  if(notes.length) s+=` ${cap(notes[0])}.`;
  return s;
}

/* ---------- Render helpers ---------- */
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
function tileHtml(item,mini){
  const ph=PHOTOS[item.id]||item.photo;
  const tint=`--tile:color-mix(in srgb, ${item.hex} 16%, var(--surface)); --tile-ink:${item.hex}`;
  const inner=ph?`<img src="${ph}" alt="${item.name}">`:garmentSvg(item.sub)+`<span class="swatch" style="background:${item.hex}"></span>`;
  if(mini) return `<div class="mini" style="${tint}">${ph?`<img src="${ph}" alt="">`:garmentSvg(item.sub)}</div>`;
  return `<div class="tile" style="${tint}">${inner}</div>`;
}
function pieceCard(item,inert){
  // NB: inert must be exactly true; pieceCard is used directly in .map(), where the 2nd arg is the index
  return `<button class="piece" ${inert===true?'':`data-anchor="${item.id}"`}>
    ${tileHtml(item)}
    <div class="card-label"><div class="nm">${item.name}</div><div class="ct">${CAT_LABEL[item.cat]}</div></div>
  </button>`;
}

function topbar(){

}
function nav(){
  const t=(k,label,icon,cls='')=>`<button class="navbtn ${cls}" data-nav="${k}" aria-current="${state.screen===k}">
     ${cls==='add'?`<span class="plus">${icon}</span>`:icon}<span>${label}</span></button>`;
  return `<nav class="nav">

    ${t('add','Add',UI.plus,'add')}

function screenBody(){
  if(state.screen==='morning') return state.anchor?lookScreen():morningScreen();

}

function outfitBlock(title,tag,parts,line,tint,big,tip){
  return `<div class="outfit" style="--otint:${tint}">
    <div class="outfit-head">
      <div><div class="effort-name" style="${big?'font-size:22px':''}">${title}</div><div class="effort-sub">${tag}</div></div>
    </div>
    <div class="pieces" style="${big?'gap:10px':''}">${parts.map(p=>tileHtml(p,true)).join('')}</div>
    <p class="rationale">${line}</p>
    ${tipHtml(tip)}
  </div>`;
}
function altLine(parts,primary,fallback){
  const diff=parts.filter(p=>!primary.some(q=>q.id===p.id));
  if(diff.length){
    const d=diff.slice(0,2).map(p=>p.name.toLowerCase()).join(' and ');
    return `Swap in <b>${d}</b>. <span style="color:var(--ink-faint)">${fallback}</span>`;
  }
  return `<span style="color:var(--ink-faint)">Much like the main look. Add more pieces to your wardrobe for wider range.</span>`;
}

function bindOnboarding(){
  const root=document.getElementById('onb');
  const rerender=()=>{root.innerHTML=onbStep();bindOnboarding();};
  const on=(id,fn)=>{const e=root.querySelector('#'+id);if(e)e.addEventListener('click',fn);};
  const toggle=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
  on('obNext',()=>{onb.step=1;rerender();});
  on('obSkip',finishOnboarding);
  root.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{onb.bodyShape=b.dataset.shape;rerender();});
  root.querySelectorAll('[data-height]').forEach(b=>b.onclick=()=>{onb.heightScale=b.dataset.height;rerender();});
  root.querySelectorAll('[data-under]').forEach(b=>b.onclick=()=>{onb.undertone=b.dataset.under;rerender();});
  root.querySelectorAll('[data-contrast]').forEach(b=>b.onclick=()=>{onb.contrast=b.dataset.contrast;rerender();});
  root.querySelectorAll('[data-life]').forEach(b=>b.onclick=()=>{onb.lifestyle=b.dataset.life;rerender();});
  root.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>{onb.archetypes=toggle(onb.archetypes,b.dataset.arch);rerender();});
  root.querySelectorAll('[data-nogo]').forEach(b=>b.onclick=()=>{onb.noGo=toggle(onb.noGo,b.dataset.nogo);rerender();});
  root.querySelectorAll('[data-love]').forEach(b=>b.onclick=()=>{onb.loved=toggle(onb.loved,b.dataset.love);onb.hated=onb.hated.filter(x=>x!==b.dataset.love);rerender();});
  root.querySelectorAll('[data-hate]').forEach(b=>b.onclick=()=>{onb.hated=toggle(onb.hated,b.dataset.hate);onb.loved=onb.loved.filter(x=>x!==b.dataset.hate);rerender();});
  const nameEl=root.querySelector('#obName'); if(nameEl)nameEl.oninput=e=>onb.name=e.target.value;
  on('ob1Next',()=>{const n=root.querySelector('#obName');if(n)onb.name=n.value;onb.step=2;rerender();});
  on('ob2Next',()=>{onb.step=3;rerender();});
  on('ob3Next',()=>{onb.step=4;rerender();});
  on('ob4Next',()=>{onb.step=5;rerender();});
  const selfIn=root.querySelector('#selfPhotos');
  if(selfIn)selfIn.onchange=async e=>{
    const files=[...e.target.files].slice(0,6);
    for(const f of files){
      const r=await fileToTile(f);
      if(r.error)continue;
      const key='self'+onb.selfCount++;
      PHOTOS[key]=r.photo;idb.put(key,r.photo);
      const t=root.querySelector('#selfThumbs');if(t){const im=new Image();im.src=r.photo;t.appendChild(im);}
    }
    const lbl=root.querySelector('label[for="selfPhotos"] div div');if(lbl)lbl.textContent=`saved to your profile · ${onb.selfCount} added`;
  };
  const inspo=root.querySelector('#inspo');
  if(inspo)inspo.onchange=e=>{const t=root.querySelector('#inspoThumbs');onb.inspo+=e.target.files.length;
    [...e.target.files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=ev=>{const im=new Image();im.src=ev.target.result;t.appendChild(im);};r.readAsDataURL(f);});};
  on('obDone',finishOnboarding);
}
function finishOnboarding(){
  const prev=store.profile||{};
  store.profile={...prev,name:onb.name,bodyShape:onb.bodyShape,heightScale:onb.heightScale,lifestyle:onb.lifestyle,
    undertone:onb.undertone,contrast:onb.contrast,loved:onb.loved,hated:onb.hated,
    archetypes:onb.archetypes,noGo:onb.noGo,inspo:onb.inspo,selfCount:onb.selfCount||prev.selfCount||0};
  store.onboarded=true;
  state.screen='morning';
  render();
}

      if(r.error){errs.push(r.error);}
      else{
        const colour=nearestColourName(r.hex);
        out.push({photo:r.photo,hex:r.hex,cat,formality:3,name:`${colour} ${IMPNOUN[cat]}`});
      }
      state.importProgress.done++;render();
    }
    state.importQueue=out;state.importErrors=errs;state.importBusy=false;render();
    document.getElementById('screen')?.scrollTo(0,0);
  };
  document.querySelectorAll('[data-imp-name]').forEach(inp=>inp.oninput=e=>{state.importQueue[+inp.dataset.impName].name=e.target.value;});
  document.querySelectorAll('[data-imp-form]').forEach(b=>b.onclick=()=>{
    const[i,v]=b.dataset.impForm.split(':');state.importQueue[+i].formality=+v;keepScroll(render);});
  document.querySelectorAll('[data-imp-rm]').forEach(b=>b.onclick=()=>{state.importQueue.splice(+b.dataset.impRm,1);keepScroll(render);});
  const impCommit=document.getElementById('impCommit');
  if(impCommit)impCommit.onclick=()=>{
    const w=store.wardrobe;
    state.importQueue.forEach((it,i)=>{
      const id='u'+Date.now().toString(36)+i;
      w.push({id,name:it.name.trim()||`${nearestColourName(it.hex)} ${IMPNOUN[it.cat]}`,cat:it.cat,sub:SUBDEF[it.cat],
        hex:it.hex,color:nearestColourName(it.hex),neutral:isNeutral(it.hex),formality:it.formality,tags:[]});
      PHOTOS[id]=it.photo;idb.put(id,it.photo);
    });
    store.wardrobe=w;
    state.importQueue=null;state.importErrors=null;state.screen='wardrobe';state.wardrobeFilter='all';state.wEdit=false;
    render();document.getElementById('screen')?.scrollTo(0,0);
  };

  // add flow
  document.querySelectorAll('[data-dcat]').forEach(b=>b.onclick=()=>{state.draft={...(state.draft||{}),cat:b.dataset.dcat};render();});
  document.querySelectorAll('[data-dhex]').forEach(b=>b.onclick=()=>{state.draft={...(state.draft||{}),hex:b.dataset.dhex};render();});
  const dname=document.getElementById('dname'); if(dname)dname.oninput=e=>{state.draft={...(state.draft||{}),name:e.target.value};};
  const dform=document.getElementById('dform'); if(dform)dform.oninput=e=>{state.draft={...(state.draft||{}),formality:+e.target.value};};
  const photo=document.getElementById('photo');
  if(photo)photo.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{state.draft={...(state.draft||{}),photo:ev.target.result};
      const pv=document.getElementById('photoPrev');if(pv)pv.innerHTML=`<div style="width:96px;margin:14px auto 0">${tileHtml({...(state.draft||{}),sub:'tshirt',hex:'#ccc'})}</div>`;};
    r.readAsDataURL(f);};
  const dtest=document.getElementById('dtest');
  if(dtest)dtest.onclick=()=>{
    const d=state.draft||{};
    const sub={top:'tshirt',bottom:'trousers',dress:'dress',outerwear:'blazer',shoes:'flat',jewellery:'necklace'}[d.cat||'top'];
    const item={id:'new'+Date.now(),name:d.name||'New piece',cat:d.cat||'top',sub,hex:d.hex||'#B08A5B',
      color:colourName(d.hex||'#B08A5B'),neutral:isNeutral(d.hex||'#B08A5B'),formality:d.formality||3,tags:[],photo:d.photo};
    if(!d.cat){alert('Pick what kind of piece it is first.');return;}
    state.draft={item,confirmed:true};render();document.getElementById('screen')?.scrollTo(0,0);};
  const addConfirm=document.getElementById('addConfirm');
  if(addConfirm)addConfirm.onclick=()=>{const w=store.wardrobe;const item=state.draft.item;
    if(item.photo){PHOTOS[item.id]=item.photo;idb.put(item.id,item.photo);delete item.photo;} // photos live in IDB, not localStorage
    w.push(item);store.wardrobe=w;
    state.draft=null;state.screen='wardrobe';state.wardrobeFilter='all';render();};
  const addDiscard=document.getElementById('addDiscard');
  if(addDiscard)addDiscard.onclick=()=>{state.draft=null;render();};

  // profile: backup & restore (wardrobe + profile + all photos)
  const backup=document.getElementById('backup');
  if(backup)backup.onclick=()=>{
    const data={app:'muse',v:1,when:new Date().toISOString(),
      wardrobe:store.wardrobe,profile:store.profile,photos:PHOTOS};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='muse-backup.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  };
  const restoreFile=document.getElementById('restoreFile');
  if(restoreFile)restoreFile.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.app!=='muse'||!Array.isArray(d.wardrobe))throw new Error('not a Muse backup');
        if(!confirm(`Restore ${d.wardrobe.length} pieces${d.when?` from ${d.when.slice(0,10)}`:''}? This replaces what's here now.`))return;
        store.wardrobe=d.wardrobe;
        store.profile=d.profile||{};
        store.onboarded=true;
        PHOTOS=d.photos||{};
        Object.entries(PHOTOS).forEach(([k,v])=>idb.put(k,v));
        state.screen='wardrobe';state.wardrobeFilter='all';render();
      }catch(err){alert('That file doesn’t look like a Muse backup. Nothing was changed.');}
    };
    r.readAsText(f);
  };
  const redo=document.getElementById('redo'); if(redo)redo.onclick=()=>{const pf=store.profile||{};onb={...freshOnb(),name:pf.name||'',bodyShape:pf.bodyShape||'',heightScale:pf.heightScale||'',lifestyle:pf.lifestyle||'',undertone:pf.undertone||'',contrast:pf.contrast||'',loved:pf.loved||[],hated:pf.hated||[],archetypes:pf.archetypes||[],noGo:pf.noGo||[],inspo:pf.inspo||0,selfCount:pf.selfCount||0};store.onboarded=false;render();};
  const reset=document.getElementById('reset'); if(reset)reset.onclick=()=>{if(confirm('Reset your wardrobe and profile back to the sample?')){localStorage.clear();
    PHOTOS={};try{store.wardrobe&&idb.db&&idb.db.transaction('photos','readwrite').objectStore('photos').clear();}catch(e){}
    state={screen:'morning',anchor:null,occasion:'everyday',draft:null,plan:{temp:2,rain:false,activity:'errands',feel:'comfortable',duration:'day',effort:'auto',note:'',result:null}};onb=freshOnb();render();}};
}
function isNeutral(hex){const h=hueOf(hex);const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const sat=mx===0?0:(mx-mn)/mx; return sat<0.22 || (h>20&&h<50&&sat<0.45);}
function colourName(hex){const names={'#211E1C':'Black','#F1EFE9':'White','#B08A5B':'Camel','#5D6B82':'Denim','#8E9A7C':'Sage','#9C6B74':'Rosewood','#C6A16A':'Gold','#C7B9A1':'Beige','#33405C':'Navy','#6E6A4B':'Olive'};return names[hex]||'New tone';}

/* ---------- Go ---------- */
// Once real pieces exist, retire the built-in sample wardrobe automatically
(function(){
  const w=store.wardrobe;
  if(w.some(it=>/^(u|new)/.test(it.id)) && w.some(isSample)) store.wardrobe=w.filter(it=>!isSample(it));
})();
render();
idb.open().then(()=>idb.all()).then(p=>{PHOTOS=p;if(Object.keys(p).length)render();});
</script>
</body>
